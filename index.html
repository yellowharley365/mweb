
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>سایت نمایشی من</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Tahoma, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        header {
            background: #2563eb;
            color: white;
            padding: 60px 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            text-align: center;
        }

        button {
            background: #2563eb;
            color: white;
            border: 0;
            padding: 13px 30px;
            border-radius: 8px;
            cursor: pointer;
        }

        footer {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
    </style>
</head>

<body>

<header>
    <h1>به سایت من خوش آمدید</h1>
    <p>اولین سایت نمایشی من با GitHub Pages</p>
</header>

<main>
    <h2>درباره ما</h2>
    <p>
        این یک وب‌سایت آزمایشی است که با HTML و CSS
        طراحی شده است.
    </p>

    <button onclick="alert('سلام! سایت با موفقیت اجرا شد.')">
        کلیک کن
    </button>
</main>

<footer>
    تمامی حقوق محفوظ است © 2026
</footer>

</body>
</html>
